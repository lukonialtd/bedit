[package]
name = "bedit"
version = "0.1.1"
edition = "2021"
description = "Rust revision-backed editor wrappers and repository CLI"
license = "GPL-3.0-or-later"

[lib]
name = "bedit"
path = "src/lib.rs"

[dependencies]
crossterm = "0.28"
libc = "0.2"
ratatui = "0.29"
rustix = { version = "1.1", features = ["fs"] }
